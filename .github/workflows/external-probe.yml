name: External GoProxy probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/external-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify relay from outside VM
        shell: bash
        run: |
          set -euo pipefail
          base='https://8.235.7.248/goproxy'
          echo 'health:'
          curl --max-time 10 -fsS "$base/health"
          echo
          echo 'unregistered MCP response:'
          code="$(curl --max-time 10 -sS -o /tmp/mcp-body -w '%{http_code}' "$base/mcp")"
          cat /tmp/mcp-body
          echo
          echo "status=$code"
          test "$code" = '503'
