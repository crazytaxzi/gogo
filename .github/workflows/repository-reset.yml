name: One-time repository reset

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write
  pages: write
  deployments: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Purge legacy repository state and rewrite root
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail

          cp .github/workflows/repository-reset.yml /tmp/repository-reset.yml

          echo "Disable GitHub Pages if configured"
          gh api --method DELETE "repos/$REPO/pages" >/dev/null 2>&1 || true

          echo "Delete all releases and release assets"
          mapfile -t release_ids < <(gh api "repos/$REPO/releases?per_page=100" --paginate --jq '.[].id' || true)
          for release_id in "${release_ids[@]:-}"; do
            [[ -z "$release_id" ]] && continue
            gh api --method DELETE "repos/$REPO/releases/$release_id"
          done

          echo "Delete all tags"
          git fetch --tags --force
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            git push origin ":refs/tags/$tag"
          done < <(git tag -l)

          echo "Delete every branch except main"
          while IFS= read -r ref; do
            branch="${ref#refs/heads/}"
            [[ "$branch" == "main" ]] && continue
            git push origin --delete "$branch"
          done < <(git ls-remote --heads origin | awk '{print $2}')

          echo "Cancel and delete all older workflow runs"
          mapfile -t runs < <(gh api "repos/$REPO/actions/runs?per_page=100" --paginate --jq '.workflow_runs[] | "\(.id) \(.status)"' || true)
          for row in "${runs[@]:-}"; do
            [[ -z "$row" ]] && continue
            run_id="${row%% *}"
            status="${row#* }"
            [[ "$run_id" == "$THIS_RUN" ]] && continue

            if [[ "$status" != "completed" ]]; then
              gh api --method POST "repos/$REPO/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
              for _ in {1..30}; do
                status="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo completed)"
                [[ "$status" == "completed" ]] && break
                sleep 2
              done
            fi

            gh api --method DELETE "repos/$REPO/actions/runs/$run_id" >/dev/null 2>&1 || true
          done

          echo "Remove stale deployments when GitHub permits it"
          mapfile -t deployment_ids < <(gh api "repos/$REPO/deployments?per_page=100" --paginate --jq '.[].id' || true)
          for deployment_id in "${deployment_ids[@]:-}"; do
            [[ -z "$deployment_id" ]] && continue
            gh api --method POST "repos/$REPO/deployments/$deployment_id/statuses" -f state='inactive' >/dev/null 2>&1 || true
            gh api --method DELETE "repos/$REPO/deployments/$deployment_id" >/dev/null 2>&1 || true
          done

          echo "Create a new parentless root commit while preserving only this temporary cleanup workflow"
          git config user.name "Repository Reset"
          git config user.email "repository-reset@users.noreply.github.com"
          git checkout --orphan repository-reset-root
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          mkdir -p .github/workflows
          cp /tmp/repository-reset.yml .github/workflows/repository-reset.yml
          git add .github/workflows/repository-reset.yml
          git commit -m "Fresh repository root [skip ci]"
          git push --force origin HEAD:main
