name: Extend GoMCP OAuth request TTL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extend-oauth-request-ttl.yml'

permissions:
  contents: write

jobs:
  extend:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extend authorization request lifetime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('relay/oauth.py')
          s = p.read_text(encoding='utf-8')
          old = '    REQUEST_TTL = 600\n'
          new = '    REQUEST_TTL = 3600\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one REQUEST_TTL=600, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile relay/oauth.py relay/goproxy.py
          git config user.name 'GoMCP Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add relay/oauth.py
          git commit -m 'Extend OAuth authorization request lifetime'
          git push origin HEAD:main

      - name: Install live relay OAuth code
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 relay/oauth.py "$HOME/GoProxy/oauth.py"
          sudo systemctl restart goproxy.service
          sudo systemctl is-active --quiet goproxy.service
          for i in {1..20}; do
            if curl --max-time 5 -fsS https://gomcp-8-235-7-248.nip.io/.well-known/oauth-authorization-server/goproxy/oauth >/dev/null; then
              echo 'oauth_request_ttl=3600 live=yes'
              exit 0
            fi
            sleep 1
          done
          echo 'relay did not become healthy' >&2
          exit 1
