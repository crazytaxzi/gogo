name: Fix OAuth token wiring

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-oauth-token-wiring.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix token exchange and access scope wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('relay/goproxy.py')
          s=p.read_text()
          old=s
          stale='''    def _oauth_token(self) -> None:\n        try:\n            form = self._read_form()\n            result = self.oauth.token(form)\n            self._json(200, result)\n        except OAuthError as exc:\n            self._oauth_error(exc)\n'''
          fixed='''    def _oauth_token(self) -> None:\n        try:\n            try:\n                length = int(self.headers.get("Content-Length", "0"))\n            except ValueError as exc:\n                raise OAuthError("invalid_request", "Invalid Content-Length") from exc\n            if length < 1 or length > 65536:\n                raise OAuthError("invalid_request", "Invalid request body length")\n            form = self.oauth.parse_form(self.rfile.read(length))\n            result = self.oauth.exchange_token(form)\n            self._json(200, result)\n        except OAuthError as exc:\n            self._oauth_error(exc)\n'''
          if stale not in s:
              raise SystemExit('stale token handler block not found')
          s=s.replace(stale,fixed,1)
          stale_scope='valid = self.oauth.validate_access_token(supplied, self.oauth.resource) if supplied else None'
          fixed_scope='valid = self.oauth.validate_access_token(supplied, "gomcp") if supplied else None'
          if stale_scope not in s:
              raise SystemExit('stale access-token scope wiring not found')
          s=s.replace(stale_scope,fixed_scope,1)
          if s == old:
              raise SystemExit('no changes made')
          p.write_text(s)
          PY
          python3 -m py_compile relay/goproxy.py relay/oauth.py
          grep -q 'self.oauth.exchange_token(form)' relay/goproxy.py
          grep -q 'validate_access_token(supplied, "gomcp")' relay/goproxy.py
          if grep -q 'self.oauth.token(form)' relay/goproxy.py; then exit 1; fi
          git config user.name 'GoMCP Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add relay/goproxy.py
          git commit -m 'Fix OAuth token exchange and access scope wiring'
          git push origin HEAD:main
