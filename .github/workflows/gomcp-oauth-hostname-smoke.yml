name: Smoke GoMCP OAuth hostname

on:
  push:
    branches: [main]
    paths: ['.github/workflows/gomcp-oauth-hostname-smoke.yml']

jobs:
  smoke:
    runs-on: [self-hosted, GoMCP]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exercise complete OAuth flow through DNS hostname
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GOMCP_OWNER_KEY_FILE: C:\actions-runner\GoMCP\state\mcp.token
          GOMCP_PUBLIC_ORIGIN: https://gomcp-8-235-7-248.nip.io
        run: |
          $ErrorActionPreference = 'Stop'
          node '.\mcp\oauth-smoke.js'
          if ($LASTEXITCODE -ne 0) { throw 'Hostname OAuth smoke failed' }
