name: Inspect relay front door

on:
  push:
    branches: [main]
    paths: ['.github/workflows/frontdoor-inspect.yml']

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Inspect existing Docker front door
        shell: bash
        run: |
          set -u
          echo '=== listeners ==='
          sudo ss -ltnp | grep -E ':(80|443)\b' || true
          echo '=== docker containers ==='
          sudo docker ps --format 'table {{.ID}}\t{{.Image}}\t{{.Names}}\t{{.Ports}}' || true
          echo '=== compose projects ==='
          sudo docker compose ls 2>/dev/null || true
