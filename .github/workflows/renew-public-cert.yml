name: Renew public HTTPS certificate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/renew-public-cert.yml']

jobs:
  renew:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Inspect and renew public certificate
        shell: bash
        run: |
          set -euo pipefail
          project=/home/crazytaxzi/Neon_Wreckers_TTV_Overlay
          public_host="$(sed -n 's/^PUBLIC_HOST=//p' "$project/.env" | tail -n1 | tr -d '\r\"')"
          test -n "$public_host"
          echo "public_host=$public_host"
          echo 'before:'
          sudo openssl x509 -in "/etc/letsencrypt/live/${public_host}/fullchain.pem" -noout -dates -issuer -subject || true
          sudo certbot --version

          echo 'stopping gateway briefly for standalone ACME challenge'
          cd "$project"
          sudo docker compose stop gateway
          restart_gateway() { sudo docker compose up -d gateway >/dev/null 2>&1 || true; }
          trap restart_gateway EXIT

          sudo certbot certonly \
            --standalone \
            --non-interactive \
            --agree-tos \
            --force-renewal \
            --preferred-profile shortlived \
            --cert-name "$public_host" \
            --ip-address "$public_host"

          restart_gateway
          trap - EXIT

          echo 'after:'
          sudo openssl x509 -in "/etc/letsencrypt/live/${public_host}/fullchain.pem" -noout -dates -issuer -subject
          for i in {1..30}; do
            if curl -fsS "https://${public_host}/health" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "https://${public_host}/health"
          echo
