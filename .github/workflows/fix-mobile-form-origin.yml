name: Fix GoMCP mobile form origin handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-form-origin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile same-origin POST handling and deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('relay/goproxy.py')
          s = p.read_text(encoding='utf-8')
          old = '''    def _same_origin_post(self) -> bool:\n        expected = self.oauth.public_origin\n        origin = self.headers.get("Origin", "")\n        if origin:\n            return origin.rstrip("/") == expected\n        referer = self.headers.get("Referer", "")\n        if referer:\n            parsed = urlsplit(referer)\n            return f"{parsed.scheme}://{parsed.netloc}".rstrip("/") == expected\n        return False\n'''
          new = '''    def _same_origin_post(self) -> bool:\n        expected = self.oauth.public_origin\n        origin = self.headers.get("Origin", "")\n        if origin:\n            return origin.rstrip("/") == expected\n        referer = self.headers.get("Referer", "")\n        if referer:\n            parsed = urlsplit(referer)\n            return f"{parsed.scheme}://{parsed.netloc}".rstrip("/") == expected\n        # Some mobile browsers legitimately omit both Origin and Referer on\n        # same-origin form POSTs. CSRF still requires the per-session token\n        # plus the Secure, HttpOnly, SameSite=Lax session cookie.\n        return True\n'''
          if old not in s:
              raise SystemExit('same-origin function target not found')
          s = s.replace(old, new, 1)
          s = s.replace('self.send_header("Referrer-Policy", "no-referrer")', 'self.send_header("Referrer-Policy", "same-origin")', 1)
          p.write_text(s, encoding='utf-8')
          PY

          python3 -m py_compile relay/goproxy.py relay/admin_auth.py relay/oauth.py relay/tool_policy.py
          python3 relay/selftest.py
          python3 - <<'PY'
          from relay.goproxy import Handler, PUBLIC_ORIGIN
          class OAuth: public_origin = PUBLIC_ORIGIN
          class Server: oauth = OAuth()
          h = object.__new__(Handler)
          h.server = Server()
          h.headers = {}
          assert h._same_origin_post() is True
          h.headers = {'Origin': PUBLIC_ORIGIN}
          assert h._same_origin_post() is True
          h.headers = {'Origin': 'https://evil.example'}
          assert h._same_origin_post() is False
          h.headers = {'Referer': PUBLIC_ORIGIN + '/goproxy/admin/password'}
          assert h._same_origin_post() is True
          print('mobile_form_origin_logic=pass')
          PY

          install -m 0755 relay/goproxy.py "$HOME/GoProxy/goproxy.py"
          sudo systemctl restart goproxy.service
          sudo systemctl is-active --quiet goproxy.service
          for i in {1..20}; do
            if curl --max-time 5 -fsS https://gomcp-8-235-7-248.nip.io/goproxy/login >/tmp/gomcp-login.html; then break; fi
            sleep 1
          done
          grep -q 'GoMCP Admin Login' /tmp/gomcp-login.html

          git config user.name 'GoMCP Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add relay/goproxy.py
          git commit -m 'Allow mobile same-origin form POSTs without referrer headers'
          git push origin HEAD:main
          echo 'mobile_form_origin_fix=live'
