name: Fix GoMCP password form submission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-password-submit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch password form and deploy live
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('relay/goproxy.py')
          s = p.read_text(encoding='utf-8')
          old = '''<label for="new_password">New password</label><input id="new_password" name="new_password" type="password" minlength="{self.admin_auth.PASSWORD_MIN_CHARS}" required autocomplete="new-password">\n<label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="{self.admin_auth.PASSWORD_MIN_CHARS}" required autocomplete="new-password"><button type="submit">Change password</button></form>\n<p class="muted">Changing the password signs out all existing GoMCP admin browser sessions. OAuth refresh tokens are left intact.</p></section>'''
          new = '''<label for="new_password">New password</label><input id="new_password" name="new_password" type="password" required autocomplete="new-password">\n<p class="muted">Minimum {self.admin_auth.PASSWORD_MIN_CHARS} characters.</p>\n<label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password">\n<input class="submit-button" type="submit" value="Change password"></form>\n<p class="muted">Changing the password signs out all existing GoMCP admin browser sessions. OAuth refresh tokens are left intact.</p></section>'''
          if old not in s:
              raise SystemExit('password form target not found')
          s = s.replace(old, new, 1)
          css_old = 'button,.button{border:0;border-radius:999px;padding:10px 16px;background:#f5f5f5;color:#111;font-weight:750;cursor:pointer;text-decoration:none;display:inline-block}'
          css_new = 'button,.button,input[type=submit]{border:0;border-radius:999px;padding:10px 16px;background:#f5f5f5;color:#111;font-weight:750;cursor:pointer;text-decoration:none;display:inline-block;width:auto;-webkit-appearance:none;appearance:none;touch-action:manipulation}'
          if css_old not in s:
              raise SystemExit('button css target not found')
          s = s.replace(css_old, css_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile relay/goproxy.py relay/admin_auth.py relay/oauth.py relay/tool_policy.py
          python3 relay/selftest.py
          install -m 0755 relay/goproxy.py "$HOME/GoProxy/goproxy.py"
          sudo systemctl restart goproxy.service
          sudo systemctl is-active --quiet goproxy.service
          for i in {1..20}; do
            if curl --max-time 5 -fsS https://gomcp-8-235-7-248.nip.io/goproxy/login >/tmp/gomcp-login.html; then break; fi
            sleep 1
          done
          grep -q 'GoMCP Admin Login' /tmp/gomcp-login.html
          git config user.name 'GoMCP Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add relay/goproxy.py
          git commit -m 'Fix password form submission on mobile browsers'
          git push origin HEAD:main
          echo 'password_form_submit_fix=live'
