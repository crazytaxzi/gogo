name: Activate new GoMCP owner verifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-owner-verifier-now.yml'

jobs:
  activate:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Activate verifier
        shell: bash
        run: |
          set -euo pipefail
          hash="$(tr -d '\r\n' < relay/owner-token.sha256)"
          [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          printf '%s\n' "$hash" > "$HOME/GoProxy/state/owner-token.sha256"
          sudo systemctl restart goproxy.service
          sudo systemctl is-active --quiet goproxy.service
          curl --max-time 10 -fsS https://gomcp-8-235-7-248.nip.io/goproxy/health >/dev/null
          echo 'owner_verifier_live=yes'
