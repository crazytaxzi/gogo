name: Diagnose GoMCP OAuth 0947

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-oauth-0947.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Inspect recent OAuth exchange without secrets
        shell: bash
        run: |
          set -euo pipefail
          echo '=== goproxy request statuses 16:45-16:51 UTC ==='
          sudo journalctl -u goproxy.service --since '2026-08-31 16:45:00 UTC' --until '2026-08-31 16:51:00 UTC' --no-pager -o cat \
            | grep -E '"(GET|POST) ' \
            | sed -E 's#(GET|POST) ([^ ?"]+)\?[^ "]+#\1 \2?<redacted>#g; s#^[0-9a-fA-F:.]+ #-client- #g' \
            || true

          echo '=== oauth state summary ==='
          python3 - <<'PY'
          import json
          import pathlib
          import time
          p = pathlib.Path.home() / 'GoProxy/state/oauth.json'
          d = json.loads(p.read_text())
          now = time.time()
          for key in ('clients','authorization_requests','codes','access_tokens','refresh_tokens'):
              bucket = d.get(key, {})
              print('%s=%s' % (key, len(bucket) if isinstance(bucket, dict) else 'invalid'))
          for row in sorted([r for r in d.get('authorization_requests', {}).values() if isinstance(r, dict)], key=lambda r: r.get('created_at', 0), reverse=True)[:5]:
              print('auth_request age_sec=%d expires_in_sec=%d redirect=%s' % (max(0, int(now-float(row.get('created_at', now)))), int(float(row.get('expires_at', 0))-now), row.get('redirect_uri','')))
          for row in sorted([r for r in d.get('codes', {}).values() if isinstance(r, dict)], key=lambda r: r.get('expires_at', 0), reverse=True)[:5]:
              print('auth_code expires_in_sec=%d redirect=%s' % (int(float(row.get('expires_at', 0))-now), row.get('redirect_uri','')))
          PY

          echo '=== current service ==='
          sudo systemctl is-active goproxy.service
