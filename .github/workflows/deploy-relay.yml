name: Deploy GoProxy relay

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

concurrency:
  group: goproxy-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - name: Check out relay source
        uses: actions/checkout@v4

      - name: Validate relay source and public DNS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile relay/goproxy.py relay/oauth.py relay/admin_auth.py relay/tool_policy.py relay/selftest.py relay/gateway_patch.py
          python3 relay/selftest.py
          bash -n relay/gateway_sync.sh relay/certbot_pre.sh relay/certbot_post.sh relay/cert_renew.sh
          gomcp_host="$(tr -d '\r\n ' < relay/public_host.txt)"
          test -n "$gomcp_host"
          echo "gomcp_host=$gomcp_host"
          getent ahostsv4 "$gomcp_host" | tee /tmp/gomcp-dns.txt
          grep -q '8\.235\.7\.248' /tmp/gomcp-dns.txt

      - name: Install under ~/GoProxy
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$HOME/GoProxy"
          mkdir -p "$install_dir/state"
          chmod 700 "$install_dir/state"
          install -m 0755 relay/goproxy.py "$install_dir/goproxy.py"
          install -m 0644 relay/oauth.py "$install_dir/oauth.py"
          install -m 0644 relay/admin_auth.py "$install_dir/admin_auth.py"
          install -m 0644 relay/tool_policy.py "$install_dir/tool_policy.py"
          install -m 0644 relay/public_host.txt "$install_dir/public_host.txt"
          install -m 0755 relay/gateway_patch.py "$install_dir/gateway_patch.py"
          install -m 0755 relay/gateway_sync.sh "$install_dir/gateway_sync.sh"
          install -m 0755 relay/certbot_pre.sh "$install_dir/certbot_pre.sh"
          install -m 0755 relay/certbot_post.sh "$install_dir/certbot_post.sh"
          install -m 0755 relay/cert_renew.sh "$install_dir/cert_renew.sh"
          install -m 0644 relay/goproxy.service "$install_dir/goproxy.service"
          install -m 0644 relay/goproxy-cert-renew.service "$install_dir/goproxy-cert-renew.service"
          install -m 0644 relay/goproxy-cert-renew.timer "$install_dir/goproxy-cert-renew.timer"

          admin_credential="$install_dir/state/admin-credential.json"
          if [[ ! -s "$admin_credential" ]]; then
            install -m 0600 relay/admin-bootstrap.json "$admin_credential"
            echo 'admin_credential=bootstrapped_change_required'
          else
            chmod 600 "$admin_credential"
            echo 'admin_credential=preserved'
          fi

          for name in register upstream; do
            secret_file="$install_dir/state/${name}.secret"
            if [[ ! -s "$secret_file" ]]; then
              python3 - <<'PY' > "$secret_file"
          import secrets
          print(secrets.token_urlsafe(48))
          PY
              chmod 600 "$secret_file"
            fi
          done

      - name: Install services and Certbot hooks
        shell: bash
        run: |
          set -euo pipefail
          sudo install -m 0644 "$HOME/GoProxy/goproxy.service" /etc/systemd/system/goproxy.service
          sudo install -m 0644 "$HOME/GoProxy/goproxy-cert-renew.service" /etc/systemd/system/goproxy-cert-renew.service
          sudo install -m 0644 "$HOME/GoProxy/goproxy-cert-renew.timer" /etc/systemd/system/goproxy-cert-renew.timer
          sudo install -d -m 0755 /etc/letsencrypt/renewal-hooks/pre /etc/letsencrypt/renewal-hooks/post
          sudo install -m 0755 "$HOME/GoProxy/certbot_pre.sh" /etc/letsencrypt/renewal-hooks/pre/10-goproxy-gateway-stop
          sudo install -m 0755 "$HOME/GoProxy/certbot_post.sh" /etc/letsencrypt/renewal-hooks/post/90-goproxy-gateway-start
          sudo systemctl daemon-reload
          sudo systemctl enable --now goproxy.service
          sudo systemctl restart goproxy.service
          sudo systemctl enable --now goproxy-cert-renew.timer

      - name: Ensure dedicated GoMCP TLS certificate
        shell: bash
        run: |
          set -euo pipefail
          gomcp_host="$(tr -d '\r\n ' < "$HOME/GoProxy/public_host.txt")"
          cert="/etc/letsencrypt/live/${gomcp_host}/fullchain.pem"
          project=/home/crazytaxzi/Neon_Wreckers_TTV_Overlay
          if ! sudo test -s "$cert"; then
            echo "issuing_certificate_for=$gomcp_host"
            cd "$project"
            sudo docker compose stop gateway
            restart_gateway() {
              sudo docker compose up -d gateway >/dev/null 2>&1 || true
            }
            trap restart_gateway EXIT
            sudo certbot certonly --standalone --non-interactive --agree-tos --register-unsafely-without-email -d "$gomcp_host"
            sudo test -s "$cert"
            restart_gateway
            trap - EXIT
          else
            echo 'hostname_certificate=already_present'
          fi
          sudo openssl x509 -in "$cert" -noout -subject -issuer -dates -ext subjectAltName

      - name: Sync HTTPS gateway
        shell: bash
        run: |
          set -euo pipefail
          sudo "$HOME/GoProxy/gateway_sync.sh"

      - name: Verify dedicated hostname certificate renewal
        shell: bash
        run: |
          set -euo pipefail
          gomcp_host="$(tr -d '\r\n ' < "$HOME/GoProxy/public_host.txt")"
          marker="$HOME/GoProxy/state/hostname-cert-renewal-verified"
          if [[ ! -f "$marker" ]]; then
            sudo certbot renew --cert-name "$gomcp_host" --dry-run
            touch "$marker"
          else
            echo 'hostname_renewal_hook_test=already_verified'
          fi

      - name: Verify hostname TLS OAuth login and relay
        shell: bash
        run: |
          set -euo pipefail
          gomcp_host="$(tr -d '\r\n ' < "$HOME/GoProxy/public_host.txt")"
          origin="https://${gomcp_host}"
          sudo systemctl is-active --quiet goproxy.service
          sudo systemctl is-enabled --quiet goproxy.service
          sudo systemctl is-active --quiet goproxy-cert-renew.timer
          sudo systemctl is-enabled --quiet goproxy-cert-renew.timer
          test -s "$HOME/GoProxy/state/register.secret"
          test -s "$HOME/GoProxy/state/upstream.secret"
          test -s "$HOME/GoProxy/state/admin-credential.json"

          for i in {1..30}; do
            if curl --max-time 3 -fsS http://127.0.0.1:8787/health >/dev/null 2>&1 && \
               curl --max-time 8 -fsS "${origin}/goproxy/health" >/dev/null 2>&1 && \
               curl --max-time 8 -fsS "${origin}/goproxy/login" >/dev/null 2>&1 && \
               curl --max-time 8 -fsS "${origin}/.well-known/oauth-protected-resource/goproxy/mcp" >/dev/null 2>&1 && \
               curl --max-time 8 -fsS "${origin}/.well-known/oauth-authorization-server/goproxy/oauth" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          local_health="$(curl --max-time 3 -fsS http://127.0.0.1:8787/health)"
          public_health="$(curl --max-time 8 -fsS "${origin}/goproxy/health")"
          login_page="$(curl --max-time 8 -fsS "${origin}/goproxy/login")"
          prm="$(curl --max-time 8 -fsS "${origin}/.well-known/oauth-protected-resource/goproxy/mcp")"
          asmeta="$(curl --max-time 8 -fsS "${origin}/.well-known/oauth-authorization-server/goproxy/oauth")"
          python3 - "$origin" "$local_health" "$public_health" "$prm" "$asmeta" <<'PY'
          import json, sys
          origin, local_raw, public_raw, prm_raw, as_raw = sys.argv[1:]
          local = json.loads(local_raw)
          public = json.loads(public_raw)
          prm = json.loads(prm_raw)
          meta = json.loads(as_raw)
          assert local['ok'] and local['oauth'] and local['admin_auth']
          assert public['ok'] and public['oauth'] and public['admin_auth']
          assert public['issuer'] == f'{origin}/goproxy/oauth'
          assert prm['resource'] == f'{origin}/goproxy/mcp'
          assert prm['authorization_servers'] == [f'{origin}/goproxy/oauth']
          assert meta['issuer'] == f'{origin}/goproxy/oauth'
          assert meta['registration_endpoint'] == f'{origin}/goproxy/oauth/register'
          assert meta['token_endpoint_auth_methods_supported'] == ['none']
          assert 'refresh_token' in meta['grant_types_supported']
          assert 'S256' in meta['code_challenge_methods_supported']
          print('hostname_oauth_admin_discovery=success')
          PY
          grep -q 'GoMCP Admin Login' <<< "$login_page"

          echo | openssl s_client -connect "${gomcp_host}:443" -servername "$gomcp_host" -verify_return_error 2>/dev/null | \
            openssl x509 -noout -checkhost "$gomcp_host"
          echo "mcp_endpoint=${origin}/goproxy/mcp"
          echo "admin_login=${origin}/goproxy/login"
          echo "admin_console=${origin}/goproxy/admin"
          echo "oauth_issuer=${origin}/goproxy/oauth"
          echo "oauth_registration=${origin}/goproxy/oauth/register"
