name: Deploy GoProxy relay

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Check out relay source
        uses: actions/checkout@v4

      - name: Validate relay source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile relay/goproxy.py relay/gateway_patch.py

      - name: Install under ~/GoProxy
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$HOME/GoProxy"
          mkdir -p "$install_dir/state"
          chmod 700 "$install_dir/state"
          install -m 0755 relay/goproxy.py "$install_dir/goproxy.py"
          install -m 0755 relay/gateway_patch.py "$install_dir/gateway_patch.py"
          install -m 0644 relay/goproxy.service "$install_dir/goproxy.service"

          secret_file="$install_dir/state/register.secret"
          if [[ ! -s "$secret_file" ]]; then
            python3 - <<'PY' > "$secret_file"
          import secrets
          print(secrets.token_urlsafe(48))
          PY
            chmod 600 "$secret_file"
          fi

      - name: Install and start systemd service
        shell: bash
        run: |
          set -euo pipefail
          sudo install -m 0644 "$HOME/GoProxy/goproxy.service" /etc/systemd/system/goproxy.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now goproxy.service
          sudo systemctl restart goproxy.service

      - name: Allow only Docker gateway to reach relay
        shell: bash
        run: |
          set -euo pipefail
          container=neon-wreckers-gateway-1
          gateway_ip="$(sudo docker inspect "$container" --format '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}')"
          network_name="$(sudo docker inspect "$container" --format '{{range $name, $cfg := .NetworkSettings.Networks}}{{$name}}{{end}}')"
          subnet="$(sudo docker network inspect "$network_name" --format '{{(index .IPAM.Config 0).Subnet}}')"
          bridge_if="$(ip -o -4 addr show | awk -v target="$gateway_ip" 'index($4,target"/")==1 {print $2; exit}')"
          test -n "$gateway_ip"
          test -n "$subnet"
          test -n "$bridge_if"
          sudo ufw allow in on "$bridge_if" proto tcp from "$subnet" to "$gateway_ip" port 8787 comment 'GoProxy Docker bridge'

      - name: Wire relay into HTTPS gateway
        shell: bash
        run: |
          set -euo pipefail
          project=/home/crazytaxzi/Neon_Wreckers_TTV_Overlay
          container=neon-wreckers-gateway-1
          python3 "$HOME/GoProxy/gateway_patch.py" --project "$project"
          cd "$project"
          sudo docker compose config >/dev/null

          public_host="$(sed -n 's/^PUBLIC_HOST=//p' .env | tail -n1 | tr -d '\r\"')"
          gateway_ip="$(sudo docker inspect "$container" --format '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}')"
          test -n "$public_host"
          test -n "$gateway_ip"

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          sed "s/\${PUBLIC_HOST}/${public_host}/g; s/host\.docker\.internal/${gateway_ip}/g" \
            infrastructure/gateway/nginx.conf.template > "$tmp"
          sudo docker exec -i "$container" sh -c 'cat > /etc/nginx/conf.d/default.conf' < "$tmp"
          sudo docker exec "$container" nginx -t
          sudo docker exec "$container" nginx -s reload

      - name: Verify local and public relay
        shell: bash
        run: |
          set -euo pipefail
          project=/home/crazytaxzi/Neon_Wreckers_TTV_Overlay
          public_host="$(sed -n 's/^PUBLIC_HOST=//p' "$project/.env" | tail -n1 | tr -d '\r\"')"
          test -n "$public_host"

          for i in {1..20}; do
            if curl --max-time 3 -fsS http://127.0.0.1:8787/health >/dev/null 2>&1 && \
               curl --max-time 5 -fsS "https://${public_host}/goproxy/health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          echo 'local:'
          curl --max-time 3 -fsS http://127.0.0.1:8787/health
          echo
          echo 'public:'
          curl --max-time 5 -fsS "https://${public_host}/goproxy/health"
          echo
          sudo systemctl --no-pager --full status goproxy.service
          echo "public_base=https://${public_host}/goproxy/"
          echo "mcp_endpoint=https://${public_host}/goproxy/mcp"
          echo "registration_endpoint=https://${public_host}/goproxy/admin/register"
          echo "registration_secret_file=$HOME/GoProxy/state/register.secret"
