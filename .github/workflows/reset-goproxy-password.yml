name: Reset GoProxy admin password

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Reset GoProxy admin password
        shell: bash
        env:
          RESET_PASSWORD: ${{ secrets.GOPROXY_ADMIN_RESET_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${RESET_PASSWORD:-}"
          export PYTHONPATH="$HOME/GoProxy"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from admin_auth import AdminAuth
          state = Path.home() / "GoProxy" / "state"
          auth = AdminAuth(state / "admin-credential.json", state / "admin-sessions.json")
          auth.reset_password(os.environ["RESET_PASSWORD"], must_change_password=True)
          auth.destroy_all_sessions()
          status = auth.credential_status()
          print(f"reset=ok username={status['username']} must_change_password={status['must_change_password']} active_sessions={status['active_sessions']}")
          PY
