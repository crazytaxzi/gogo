name: Fix OAuth handler wiring

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-oauth-handler.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale OAuth handler method and field names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('relay/goproxy.py')
          s=p.read_text()
          old=s
          s=s.replace('owner_key = form.get("owner_key", "")', 'access_key = form.get("access_key", "")')
          s=s.replace('redirect = self.oauth.approve_authorization(request_id, owner_key)', 'redirect = self.oauth.finish_authorization(request_id, access_key, remote_ip)')
          if s == old:
              raise SystemExit('expected stale OAuth handler text was not found')
          if 'approve_authorization' in s or 'form.get("owner_key"' in s:
              raise SystemExit('stale OAuth handler text remains')
          p.write_text(s)
          PY
          python3 -m py_compile relay/goproxy.py relay/oauth.py
          git config user.name 'GoMCP Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add relay/goproxy.py
          git commit -m 'Fix OAuth authorization POST handler'
          git push origin HEAD:main
