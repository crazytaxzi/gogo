name: Diagnose authenticated GoMCP request

on:
  push:
    branches: [main]
    paths: ['.github/workflows/gomcp-auth-diagnose.yml']

jobs:
  diagnose:
    runs-on: [self-hosted, GoMCP]
    timeout-minutes: 5
    steps:
      - name: Test authenticated MCP at each hop
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $state = 'C:\actions-runner\GoMCP\state'
          $token = (Get-Content (Join-Path $state 'mcp.token') -Raw).Trim()
          $tunnel = (Get-Content (Join-Path $state 'tunnel.json') -Raw | ConvertFrom-Json).url
          $payloadFile = Join-Path $env:RUNNER_TEMP 'gomcp-ping.json'
          [IO.File]::WriteAllText($payloadFile, '{"jsonrpc":"2.0","id":7,"method":"ping","params":{}}', [Text.UTF8Encoding]::new($false))

          function Probe([string]$name, [string]$url) {
            $bodyFile = Join-Path $env:RUNNER_TEMP ("gomcp-" + $name + '.body')
            $code = & curl.exe --max-time 20 --silent --show-error -o $bodyFile -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary "@$payloadFile" $url
            Write-Host "--- $name ---"
            Write-Host "url=$url"
            Write-Host "status=$code"
            Get-Content $bodyFile -Raw | Write-Host
          }

          Probe 'local' 'http://127.0.0.1:8765/mcp'
          Probe 'quick' ($tunnel + '/mcp')
          Probe 'stable' 'https://8.235.7.248/goproxy/mcp'
