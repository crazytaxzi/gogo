name: Relay host diagnostic

on:
  push:
    branches: [relay-build]
    paths:
      - '.github/workflows/relay-host-diagnostic.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Inspect relay host
        shell: bash
        run: |
          set -u
          echo "host=$(hostname)"
          echo "user=$(whoami)"
          echo "home=$HOME"
          echo "python=$(python3 --version 2>&1 || true)"
          echo "go=$(go version 2>&1 || true)"
          echo "curl=$(curl --version | head -n1 || true)"
          if sudo -n true 2>/dev/null; then echo "sudo_nopasswd=yes"; else echo "sudo_nopasswd=no"; fi
          echo "systemd=$(systemctl --version | head -n1 || true)"
          echo "linger=$(loginctl show-user "$(whoami)" -p Linger --value 2>/dev/null || true)"
          echo "ports:"
          ss -ltnp 2>/dev/null | grep -E ':(80|443|8787|8790)\b' || true
          echo "public_ip=$(curl -fsS --max-time 5 https://api.ipify.org 2>/dev/null || true)"
