name: Inspect gateway internals

on:
  push:
    branches: [main]
    paths: ['.github/workflows/gateway-deep-inspect.yml']

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Locate gateway source
        shell: bash
        run: |
          set -u
          cd /home/crazytaxzi/Neon_Wreckers_TTV_Overlay
          echo '=== candidates ==='
          find . -maxdepth 4 -type f \( -iname '*nginx*' -o -iname '*gateway*' -o -iname '*default.conf*' -o -name 'Dockerfile' \) -print | sort
          echo '=== references ==='
          grep -R -nE 'ssl_certificate|server_name|PUBLIC_HOST|FROM nginx' --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null | head -n 200 || true
