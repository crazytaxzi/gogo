name: Diagnose GAMEPC MCP 0947

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-gamepc-mcp-0947.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, GoMCP]
    timeout-minutes: 5
    steps:
      - name: Inspect GAMEPC MCP logs around 16:47 UTC
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'C:\actions-runner\GoMCP\logs'
          foreach ($name in @('server.log','supervisor.log')) {
            $path = Join-Path $base $name
            Write-Host "=== $name ==="
            if (Test-Path $path) {
              Get-Content $path -Tail 1200 | Where-Object {
                $_ -match '2026-08-31T16:4[5-9]:' -or $_ -match '2026-08-31 16:4[5-9]:' -or $_ -match 'initialize|tools/list|ping|error|request'
              } | ForEach-Object {
                $_ -replace '(Bearer\s+)[A-Za-z0-9._~-]+','$1<redacted>'
              }
            } else {
              Write-Host 'missing'
            }
          }
