name: Fix GoMCP protocol compatibility

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-mcp-era-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Patch source and run protocol tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mcp/gomcp.js')
          s = p.read_text(encoding='utf-8')

          old = "const PROTOCOL_CURRENT = '2026-07-28';\nconst PROTOCOL_LEGACY = '2025-11-25';\n"
          new = "const PROTOCOL_CURRENT = '2026-07-28';\nconst PROTOCOL_LEGACY_CURRENT = '2025-11-25';\nconst PROTOCOL_LEGACY = new Set(['2024-11-05', '2025-03-26', '2025-06-18', '2025-11-25']);\n"
          if old not in s:
              raise SystemExit('protocol constants target not found')
          s = s.replace(old, new, 1)

          old = "    'Cache-Control': 'no-store',\n    'MCP-Protocol-Version': PROTOCOL_CURRENT,\n    ...extraHeaders,\n"
          if old not in s:
              raise SystemExit('response header target not found')
          s = s.replace(old, "    'Cache-Control': 'no-store',\n    ...extraHeaders,\n", 1)

          start = s.index('function validateModernHeaders(req, body) {')
          end = s.index('\nasync function handleRpc(req, res, body) {', start)
          protocol_helpers = '''function requestProtocol(req, body) {
            const headerVersion = String(req.headers['mcp-protocol-version'] || '').trim();
            const meta = body && body.params && body.params._meta;
            const metaVersion = meta && typeof meta === 'object'
              ? String(meta['io.modelcontextprotocol/protocolVersion'] || '').trim()
              : '';
            if (body && body.method === 'initialize') {
              const requested = body.params && String(body.params.protocolVersion || '').trim();
              return { era: 'legacy', version: PROTOCOL_LEGACY.has(requested) ? requested : PROTOCOL_LEGACY_CURRENT };
            }
            if (headerVersion) {
              if (headerVersion === PROTOCOL_CURRENT) return { era: 'modern', version: headerVersion };
              if (PROTOCOL_LEGACY.has(headerVersion)) return { era: 'legacy', version: headerVersion };
              throw new Error(`Unsupported MCP-Protocol-Version ${headerVersion}`);
            }
            if (metaVersion) {
              if (metaVersion === PROTOCOL_CURRENT) return { era: 'modern', version: metaVersion };
              if (PROTOCOL_LEGACY.has(metaVersion)) return { era: 'legacy', version: metaVersion };
              throw new Error(`Unsupported MCP protocol version ${metaVersion}`);
            }
            return { era: 'legacy', version: '2025-03-26' };
          }

          function validateProtocolHeaders(req, body) {
            const protocol = requestProtocol(req, body);
            const method = req.headers['mcp-method'];
            const name = req.headers['mcp-name'];
            if (method && method !== body.method) throw new Error('Mcp-Method header does not match JSON-RPC method');
            const bodyName = body.params && (body.params.name || body.params.uri || body.params.taskId);
            if (name && bodyName && name !== bodyName) throw new Error('Mcp-Name header does not match request parameter');
            return protocol;
          }

          function modernResult(result, protocol) {
            if (!protocol || protocol.era !== 'modern') return result;
            const existing = result && result._meta && typeof result._meta === 'object' ? result._meta : {};
            return {
              ...result,
              _meta: {
                ...existing,
                'io.modelcontextprotocol/serverInfo': { name: 'GoMCP', version: VERSION },
              },
            };
          }
          '''
          s = s[:start] + protocol_helpers + s[end:]

          start = s.index('async function handleRpc(req, res, body) {')
          end = s.index('\nconst server = http.createServer((req, res) => {', start)
          handler = '''async function handleRpc(req, res, body) {
            const id = body.id;
            const method = body.method;
            try {
              const protocol = validateProtocolHeaders(req, body);
              if (method === 'initialize') {
                const requested = body.params && String(body.params.protocolVersion || '').trim();
                const protocolVersion = PROTOCOL_LEGACY.has(requested) ? requested : PROTOCOL_LEGACY_CURRENT;
                return jsonResponse(res, 200, rpcResult(id, {
                  protocolVersion,
                  capabilities: { tools: { listChanged: false } },
                  serverInfo: { name: 'GoMCP', version: VERSION },
                }));
              }
              if (method === 'notifications/initialized') {
                res.writeHead(202, { 'Cache-Control': 'no-store' });
                return res.end();
              }
              if (method === 'ping') return jsonResponse(res, 200, rpcResult(id, modernResult({}, protocol)));
              if (method === 'server/discover') {
                const result = {
                  supportedVersions: [PROTOCOL_CURRENT],
                  capabilities: { tools: { listChanged: false } },
                  ttlMs: 300000,
                  cacheScope: 'public',
                };
                return jsonResponse(res, 200, rpcResult(id, modernResult(result, { era: 'modern', version: PROTOCOL_CURRENT })));
              }
              if (method === 'tools/list') {
                const result = { tools: TOOLS };
                if (protocol.era === 'modern') {
                  result.ttlMs = 300000;
                  result.cacheScope = 'private';
                }
                return jsonResponse(res, 200, rpcResult(id, modernResult(result, protocol)));
              }
              if (method === 'tools/call') {
                const params = body.params || {};
                const toolName = params.name;
                if (!toolName) throw new Error('params.name is required');
                const started = Date.now();
                try {
                  const result = await callTool(toolName, params.arguments || {});
                  const structured = { ok: true, tool: toolName, durationMs: Date.now() - started, result };
                  const callResult = { content: [{ type: 'text', text: clampText(JSON.stringify(structured, null, 2)) }], structuredContent: structured, isError: false };
                  return jsonResponse(res, 200, rpcResult(id, modernResult(callResult, protocol)));
                } catch (err) {
                  const structured = { ok: false, tool: toolName, durationMs: Date.now() - started, error: err && err.message ? err.message : String(err) };
                  const callResult = { content: [{ type: 'text', text: JSON.stringify(structured) }], structuredContent: structured, isError: true };
                  return jsonResponse(res, 200, rpcResult(id, modernResult(callResult, protocol)));
                }
              }
              return jsonResponse(res, 200, rpcError(id, -32601, `Method not found: ${method}`));
            } catch (err) {
              return jsonResponse(res, 400, rpcError(id, -32602, err && err.message ? err.message : String(err)));
            }
          }
          '''
          s = s[:start] + handler + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

          node --check mcp/gomcp.js
          tmp="$(mktemp -d)"
          cleanup() {
            if [[ -n "${SERVER_PID:-}" ]]; then kill "$SERVER_PID" 2>/dev/null || true; fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          printf '%s\n' 'test-internal-token-1234567890abcdef' > "$tmp/token"
          GOMCP_HOME="$tmp" GOMCP_STATE="$tmp" GOMCP_TOKEN_FILE="$tmp/token" GOMCP_PORT=18765 node mcp/gomcp.js >"$tmp/server.log" 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18765/health >/dev/null 2>&1; then break; fi
            sleep 0.2
          done

          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error
          url = 'http://127.0.0.1:18765/mcp'
          token = 'test-internal-token-1234567890abcdef'
          def post(body, extra=None):
              data = json.dumps(body, separators=(',', ':')).encode()
              headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream'}
              headers.update(extra or {})
              req = urllib.request.Request(url, data=data, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=5) as r:
                      raw = r.read()
                      return r.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  return e.code, json.loads(raw) if raw else None

          for version in ('2025-03-26', '2025-06-18', '2025-11-25'):
              status, response = post({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':version,'capabilities':{},'clientInfo':{'name':'test','version':'1'}}})
              assert status == 200
              assert response['result']['protocolVersion'] == version

          status, response = post({'jsonrpc':'2.0','id':2,'method':'initialize','params':{'protocolVersion':'2026-07-28','capabilities':{},'clientInfo':{'name':'test','version':'1'}}})
          assert status == 200
          assert response['result']['protocolVersion'] == '2025-11-25'

          status, response = post({'jsonrpc':'2.0','method':'notifications/initialized'}, {'MCP-Protocol-Version':'2025-11-25'})
          assert status == 202 and response is None

          status, response = post({'jsonrpc':'2.0','id':3,'method':'tools/list','params':{}}, {'MCP-Protocol-Version':'2025-11-25'})
          assert status == 200 and len(response['result']['tools']) == 50
          assert 'ttlMs' not in response['result']

          meta = {'io.modelcontextprotocol/protocolVersion':'2026-07-28','io.modelcontextprotocol/clientCapabilities':{},'io.modelcontextprotocol/clientInfo':{'name':'test','version':'1'}}
          status, response = post({'jsonrpc':'2.0','id':4,'method':'server/discover','params':{'_meta':meta}}, {'MCP-Protocol-Version':'2026-07-28','Mcp-Method':'server/discover'})
          assert status == 200
          assert response['result']['supportedVersions'] == ['2026-07-28']
          assert response['result']['_meta']['io.modelcontextprotocol/serverInfo']['name'] == 'GoMCP'

          status, response = post({'jsonrpc':'2.0','id':5,'method':'tools/list','params':{'_meta':meta}}, {'MCP-Protocol-Version':'2026-07-28','Mcp-Method':'tools/list'})
          assert status == 200 and len(response['result']['tools']) == 50
          assert response['result']['ttlMs'] == 300000
          print('dual_era_protocol_tests=success legacy=success modern=success tools=50')
          PY

          git config user.name 'GoMCP Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add mcp/gomcp.js
          git commit -m 'Serve legacy and modern MCP eras correctly'
          git push origin HEAD:main

  deploy:
    needs:
      - patch
    runs-on:
      - self-hosted
      - GoMCP
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install and validate on GAMEPC
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $install = 'C:\actions-runner\GoMCP'
          $state = Join-Path $install 'state'
          node --check '.\mcp\gomcp.js'
          if ($LASTEXITCODE -ne 0) { throw 'gomcp syntax invalid' }
          Copy-Item -Force '.\mcp\gomcp.js' (Join-Path $install 'gomcp.js')

          $pidFile = Join-Path $state 'supervisor.pid'
          if (Test-Path $pidFile) {
            try {
              $oldPid = [int](Get-Content $pidFile -Raw).Trim()
              if ($oldPid -gt 0) {
                taskkill.exe /PID $oldPid /T /F 2>$null | Out-Null
                Start-Sleep -Milliseconds 700
              }
            } catch {}
            Remove-Item -Force $pidFile -ErrorAction SilentlyContinue
          }
          Remove-Item -Force (Join-Path $state 'tunnel.json') -ErrorAction SilentlyContinue

          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $env:RUNNER_TRACKING_ID = 'gomcp-daemon'
          Start-Process -FilePath $node -ArgumentList @((Join-Path $install 'supervisor.js')) -WorkingDirectory $install -WindowStyle Hidden | Out-Null

          $healthy = $false
          for ($i=0; $i -lt 60; $i++) {
            try {
              $h = Invoke-RestMethod -UseBasicParsing -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 2
              if ($h.ok -and $h.toolCount -eq 50) { $healthy = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $healthy) { throw 'GoMCP did not become healthy' }

          $token = (Get-Content (Join-Path $state 'upstream.secret') -Raw).Trim()
          $headers = @{ Authorization = "Bearer $token"; 'Content-Type' = 'application/json'; Accept = 'application/json, text/event-stream' }
          $initBody = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"deploy-test","version":"1"}}}'
          $init = Invoke-RestMethod -UseBasicParsing -Method Post -Uri 'http://127.0.0.1:8765/mcp' -Headers $headers -Body $initBody -TimeoutSec 5
          if ($init.result.protocolVersion -ne '2025-11-25') { throw 'legacy initialize failed' }

          $headers['MCP-Protocol-Version'] = '2025-11-25'
          $list = Invoke-RestMethod -UseBasicParsing -Method Post -Uri 'http://127.0.0.1:8765/mcp' -Headers $headers -Body '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' -TimeoutSec 5
          if ($list.result.tools.Count -ne 50) { throw 'legacy tools/list failed' }

          $headers['MCP-Protocol-Version'] = '2026-07-28'
          $headers['Mcp-Method'] = 'server/discover'
          $discoverBody = '{"jsonrpc":"2.0","id":3,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"deploy-test","version":"1"}}}}'
          $discover = Invoke-RestMethod -UseBasicParsing -Method Post -Uri 'http://127.0.0.1:8765/mcp' -Headers $headers -Body $discoverBody -TimeoutSec 5
          if ($discover.result.supportedVersions[0] -ne '2026-07-28') { throw 'modern discover failed' }

          $ready = $false
          $tunnelFile = Join-Path $state 'tunnel.json'
          for ($i=0; $i -lt 120; $i++) {
            try {
              if (Test-Path $tunnelFile) {
                $t = Get-Content $tunnelFile -Raw | ConvertFrom-Json
                $relay = Invoke-RestMethod -UseBasicParsing -Uri 'https://gomcp-8-235-7-248.nip.io/goproxy/health' -TimeoutSec 5
                if ($relay.ok -and $relay.upstream_registered -and $relay.upstream_host -eq ([Uri]$t.url).Host) { $ready = $true; break }
              }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw 'relay did not resynchronize' }
          Write-Host 'gomcp_protocol_compat=live legacy=2025-11-25 modern=2026-07-28 tools=50 relay=ready'
