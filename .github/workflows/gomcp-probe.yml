name: Probe GoMCP runner

on:
  push:
    branches: [main]
    paths: ['.github/workflows/gomcp-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, GoMCP]
    timeout-minutes: 5
    steps:
      - name: Inspect target runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "host=$(hostname)"
          echo "user=$(whoami)"
          uname -a
          command -v python3 || true
          python3 --version || true
          command -v systemctl || true
          command -v cloudflared || true
          command -v curl || true
          command -v openssl || true
          sudo -n true && echo 'sudo_nopasswd=yes' || echo 'sudo_nopasswd=no'
