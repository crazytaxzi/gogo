name: Fix ChatGPT DCR redirect validation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-dcr-redirect.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Relax only ChatGPT-owned OAuth callback validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('relay/oauth.py')
          lines = p.read_text(encoding='utf-8').splitlines(True)
          start = lines.index('    @staticmethod\n', next(i for i,l in enumerate(lines) if 'def _validate_redirect_uri' in l) - 1)
          end = next(i for i,l in enumerate(lines[start+1:], start+1) if l.startswith('    def register_client('))
          replacement = [
              '    @staticmethod\n',
              '    def _validate_redirect_uri(uri: str) -> str:\n',
              '        parsed = urlsplit(uri)\n',
              '        host = (parsed.hostname or "").lower().rstrip(".")\n',
              '        chatgpt_owned = host == "chatgpt.com" or host.endswith(".chatgpt.com")\n',
              '        try:\n',
              '            port = parsed.port\n',
              '        except ValueError:\n',
              '            port = -1\n',
              '        if (\n',
              '            parsed.scheme.lower() != "https"\n',
              '            or not chatgpt_owned\n',
              '            or port not in (None, 443)\n',
              '            or parsed.username\n',
              '            or parsed.password\n',
              '            or parsed.fragment\n',
              '            or not parsed.path.startswith("/connector/oauth/")\n',
              '        ):\n',
              '            raise OAuthError(\n',
              '                "invalid_redirect_uri",\n',
              '                "GoMCP dynamic clients must use an HTTPS ChatGPT-owned /connector/oauth/ callback",\n',
              '            )\n',
              '        return urlunsplit(("https", parsed.netloc, parsed.path, parsed.query, ""))\n',
              '\n',
          ]
          lines[start:end] = replacement
          p.write_text(''.join(lines), encoding='utf-8')
          PY
          python3 -m py_compile relay/oauth.py relay/goproxy.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('gomcp_oauth', Path('relay/oauth.py'))
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          good = [
              'https://chatgpt.com/connector/oauth/test-id',
              'https://chatgpt.com/connector/oauth/test-id?surface=plugin',
              'https://auth.chatgpt.com/connector/oauth/test-id?x=1',
          ]
          bad = [
              'http://chatgpt.com/connector/oauth/test-id',
              'https://evil.example/connector/oauth/test-id',
              'https://chatgpt.com.evil.example/connector/oauth/test-id',
              'https://chatgpt.com/not-oauth/test-id',
          ]
          for uri in good:
              assert m.OAuthManager._validate_redirect_uri(uri) == uri
          for uri in bad:
              try: m.OAuthManager._validate_redirect_uri(uri)
              except m.OAuthError: pass
              else: raise AssertionError(f'unsafe redirect accepted: {uri}')
          print('redirect_validation_tests=success')
          PY

          git config user.name 'GoMCP Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add relay/oauth.py
          git commit -m 'Accept ChatGPT DCR callback variants'
          git push origin HEAD:main

      - name: Install fixed OAuth handler live
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 relay/oauth.py "$HOME/GoProxy/oauth.py"
          sudo systemctl restart goproxy.service
          sudo systemctl is-active --quiet goproxy.service
          sleep 1
          curl --max-time 10 -fsS https://gomcp-8-235-7-248.nip.io/.well-known/oauth-authorization-server/goproxy/oauth >/dev/null

      - name: Prove DCR accepts ChatGPT callback variants
        shell: bash
        run: |
          set -euo pipefail
          body='{"client_name":"ChatGPT DCR compatibility test","redirect_uris":["https://chatgpt.com/connector/oauth/test-callback?surface=plugin"],"token_endpoint_auth_method":"none","grant_types":["authorization_code","refresh_token"],"response_types":["code"],"application_type":"web"}'
          code="$(curl --max-time 10 -sS -o /tmp/dcr.json -w '%{http_code}' -H 'Content-Type: application/json' --data "$body" https://gomcp-8-235-7-248.nip.io/goproxy/oauth/register)"
          cat /tmp/dcr.json
          echo
          test "$code" = 201
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/dcr.json'))
          assert d['redirect_uris']==['https://chatgpt.com/connector/oauth/test-callback?surface=plugin']
          assert d['token_endpoint_auth_method']=='none'
          assert d['client_id']
          print('live_dcr=success')
          PY
