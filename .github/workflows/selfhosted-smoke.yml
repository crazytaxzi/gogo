name: Self-hosted runner smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Prove self-hosted runner execution
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "host=$(hostname)"
          echo "user=$(whoami)"
          uname -a
